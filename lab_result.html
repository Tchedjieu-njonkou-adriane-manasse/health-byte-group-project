<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Lab Result — HealthByte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>

  <div class="topbar">
    <div class="shell">
      <a class="brand" href="doctor_dashboard.html"><span class="brand-mark">H</span> HEALTHBYTE</a>
      <div class="nav-links">
        <a href="doctor_dashboard.html">Dashboard</a>
        <span class="pill-badge">Doctor ID: HB-DR-0001</span>
        <a href="#">Log out</a>
      </div>
    </div>
  </div>

  <div class="shell page">
    <div class="card">
      <div class="card-header">
        <h2>Add laboratory result</h2>
        <span class="pill-badge top">HB-PT-0001 &middot; John Doe</span>
      </div>

      <form onsubmit="alert('This would save to the database once the backend is ready!'); return false;">
        <div class="field">
          <label for="test_name">Test name</label>
          <input type="text" id="test_name" name="test_name" required placeholder="e.g. Full Blood Count">
        </div>
        <div class="field">
          <label for="test_date">Test date</label>
          <input type="date" id="test_date" name="test_date" required>
        </div>
        <div class="field">
          <label for="result_value">Result</label>
          <input type="text" id="result_value" name="result_value" placeholder="e.g. 13.2 g/dL">
        </div>
        <div class="field">
          <label for="reference_range">Reference range</label>
          <input type="text" id="reference_range" name="reference_range" placeholder="e.g. 12.0–15.5 g/dL">
        </div>
        <div class="field">
          <label for="lab_notes">Notes</label>
          <textarea id="lab_notes" name="lab_notes"></textarea>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" type="submit">Save result</button>
          <a class="btn btn-ghost" href="patient_record.html">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <div class="shell">HealthByte — static preview, no backend connected</div>
  </footer>

</body>
</html>
