<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - HEALTHBYTE</title>
  <link rel="stylesheet" href="login.css">
  <style>

    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear,
    input::-webkit-credentials-auto-fill-button {
      display: none !important;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-box">
    <a class="logo center-logo" href="index.html">
      <span>H</span> HEALTHBYTE
    </a>

    <h1>Welcome</h1>
    <p class="auth-text">Sign in to access your medical records.</p>

    <form autocomplete="on">
      <label>Email Address</label>
      <input type="email" name="email" autocomplete="email" placeholder="you@example.com">

      <label>Password</label>
      <div style="position:relative; margin-top:8px;">
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" style="width:100%; padding-right:50px; box-sizing:border-box;">
        <span id="eyeIcon" onclick="voirPassword()" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; display:flex; z-index:10;">
          <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeClosed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2e7d32" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.53 9.53a3 3 0 1 0 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </span>
      </div>

      <button class="button full" type="submit" style="margin-top:20px;">Sign In</button>
    </form>

    <p class="switch">Don't have an account? <a href="register.html" style="color:#2e7d32; font-weight:bold;">Create one</a></p>
    <a class="back" href="index.html" style="color:#2e7d32; text-decoration:underline; display:inline-block; margin-top:10px;">> Back to home</a>
  </div>

<script>
function voirPassword(){
  let input = document.getElementById("password");
  let open = document.getElementById("eyeOpen");
  let closed = document.getElementById("eyeClosed");
  if(input.type === "password"){
    input.type = "text";
    open.style.display = "none";
    closed.style.display = "block";
  } else {
    input.type = "password";
    open.style.display = "block";
    closed.style.display = "none";
  }
}
</script>

</body>
</html>
