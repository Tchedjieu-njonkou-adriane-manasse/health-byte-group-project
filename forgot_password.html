{% extends "base.html" %}
{% block title %}Reset your password — HealthByte{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="mark">H</span>
      <span class="word">HEALTHBYTE</span>
    </div>
    <h1>Forgot password?</h1>
    <p class="auth-sub">Enter your email and we'll send you a 6-digit code to reset your password.</p>

    <form method="post">
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" autofocus>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Send Code</button>
    </form>

    <p class="auth-foot">
      <a href="{{ url_for('login') }}">&larr; Back to log in</a>
    </p>
  </div>
</div>
{% endblock %}
