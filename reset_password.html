{% extends "base.html" %}
{% block title %}Enter your reset code — HealthByte{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="mark">H</span>
      <span class="word">HEALTHBYTE</span>
    </div>
    <h1>Enter your code</h1>
    <p class="auth-sub">We sent a 6-digit code to <strong>{{ email }}</strong>. Enter it below along with your new password.</p>

    <form method="post">
      <div class="field">
        <label for="code">6-digit code</label>
        <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
               placeholder="______" required autofocus
               style="letter-spacing: 0.3em; text-align: center; font-family: var(--font-mono); font-size: 1.2rem;">
      </div>
      <div class="field">
        <label for="password">New password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
          <button type="button" class="password-toggle" id="toggle-password" aria-label="Show password">👁</button>
        </div>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <div class="password-field">
          <input type="password" id="confirm_password" name="confirm_password" required minlength="6" autocomplete="new-password">
          <button type="button" class="password-toggle" id="toggle-confirm" aria-label="Show password">👁</button>
        </div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Update password</button>
    </form>

    <p class="auth-foot">
      Didn't get a code? <a href="{{ url_for('forgot_password') }}">Request a new one</a>
    </p>
  </div>
</div>

<script>
  function wireToggle(toggleId, inputId) {
    const toggle = document.getElementById(toggleId);
    const input = document.getElementById(inputId);
    toggle.addEventListener('click', () => {
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      toggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });
  }
  wireToggle('toggle-password', 'password');
  wireToggle('toggle-confirm', 'confirm_password');
</script>
{% endblock %}
