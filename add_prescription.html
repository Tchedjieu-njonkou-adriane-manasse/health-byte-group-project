{% extends "base.html" %}
{% block title %}Add prescription — HealthByte{% endblock %}
{% block content %}
<div class="card" style="max-width:640px; margin:0 auto;">
  <div class="card-header">
    <h2>Add prescription</h2>
    <span class="pill-badge">{{ patient.patient_code }} · {{ patient.full_name }}</span>
  </div>
  <form method="post">
    <div class="form-grid">
      <div class="field">
        <label for="medication">Medication</label>
        <input type="text" id="medication" name="medication" required>
      </div>
      <div class="field">
        <label for="date_prescribed">Date prescribed</label>
        <input type="date" id="date_prescribed" name="date_prescribed" required>
      </div>
      <div class="field">
        <label for="dosage">Dosage</label>
        <input type="text" id="dosage" name="dosage" placeholder="e.g. 500mg">
      </div>
      <div class="field">
        <label for="frequency">Frequency</label>
        <input type="text" id="frequency" name="frequency" placeholder="e.g. Twice daily">
      </div>
      <div class="field">
        <label for="duration">Duration</label>
        <input type="text" id="duration" name="duration" placeholder="e.g. 7 days">
      </div>
      <div class="field">
        <label for="consultation_id">Link to consultation (optional)</label>
        <select id="consultation_id" name="consultation_id">
          <option value="">None</option>
          {% for c in consultations %}
          <option value="{{ c.id }}">{{ c.visit_date }} — {{ c.reason }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field full">
        <label for="instructions">Instructions</label>
        <textarea id="instructions" name="instructions"></textarea>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" type="submit">Save prescription</button>
      <a class="btn btn-ghost" href="{{ url_for('view_patient', patient_code=patient.patient_code) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
