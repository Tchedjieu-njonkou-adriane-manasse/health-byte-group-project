<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Consultation — HealthByte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F9F8; --surface:#FFFFFF; --ink:#0E211B; --ink-soft:#435850; --ink-faint:#7C918A; --line:#DEE7E2;
    --green:#146C43; --green-dark:#0D4A2E; --green-tint:#E3F3EA;
    --radius:10px; --radius-lg:18px;
    --shadow: 0 1px 3px rgba(14,33,27,0.06), 0 10px 28px rgba(14,33,27,0.06);
    --font-ui:"IBM Plex Sans", sans-serif; --font-mono:"IBM Plex Mono", monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-ui); line-height:1.55; }
  a { color: var(--green-dark); text-decoration:none; }
  a:hover { text-decoration:underline; }

  .shell { max-width:1080px; margin:0 auto; padding:0 24px; }
  .page { padding:40px 0 80px; }

  .topbar { background:var(--surface); border-bottom:1px solid var(--line); }
  .topbar .shell { display:flex; align-items:center; justify-content:space-between; height:68px; }
  .brand { display:flex; align-items:center; gap:11px; font-weight:700; font-size:1.05rem; color:var(--ink); }
  .brand-mark { width:32px; height:32px; border-radius:9px; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; box-shadow:0 2px 6px rgba(20,108,67,0.28); }
  .nav-links { display:flex; align-items:center; gap:22px; font-size:0.92rem; }
  .nav-links a { color:var(--ink-soft); font-weight:500; }
  .pill-badge { font-family:var(--font-mono); font-size:0.74rem; background:var(--green-tint); color:var(--green-dark); padding:5px 11px; border-radius:7px; border:1px solid #CFE9DB; }

  h2 { font-size:1.3rem; font-weight:700; letter-spacing:-0.01em; margin:0; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:26px 28px; box-shadow:var(--shadow); max-width:640px; margin:0 auto; }
  .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px; }

  form { display:grid; gap:16px; }
  .field { display:grid; gap:6px; }
  label { font-size:0.82rem; font-weight:600; color:var(--ink-soft); }
  input, textarea { font-family:var(--font-ui); font-size:0.95rem; color:var(--ink); padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); width:100%; }
  textarea { resize:vertical; min-height:90px; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:var(--font-ui); font-size:0.9rem; font-weight:600; padding:10px 20px; border-radius:9px; border:1px solid transparent; cursor:pointer; }
  .btn-primary { background:var(--green); color:#fff; }
  .btn-primary:hover { background:var(--green-dark); }
  .btn-ghost { background:transparent; color:var(--green-dark); border-color:var(--line); }
  .btn-ghost:hover { background:#EEF4F0; text-decoration:none; }
  .btn-row { display:flex; gap:10px; flex-wrap:wrap; }

  .pill-badge.top { font-size:0.78rem; }
  footer { border-top:1px solid var(--line); margin-top:60px; padding:24px 0; color:var(--ink-faint); font-size:0.82rem; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="shell">
      <a class="brand" href="doctor_dashboard.html"><span class="brand-mark">H</span> HEALTHBYTE</a>
      <div class="nav-links">
        <a href="doctor_dashboard.html">Dashboard</a>
        <span class="pill-badge">Doctor ID: HB-DR-0001</span>
        <a href="#">Log out</a>
      </div>
    </div>
  </div>

  <div class="shell page">
    <div class="card">
      <div class="card-header">
        <h2>Add consultation</h2>
        <span class="pill-badge top">HB-PT-0001 &middot; John Doe</span>
      </div>

      <form onsubmit="alert('This would save to the database once the backend is ready!'); return false;">
        <div class="field">
          <label for="visit_date">Visit date</label>
          <input type="date" id="visit_date" name="visit_date" required>
        </div>
        <div class="field">
          <label for="reason">Reason for visit</label>
          <input type="text" id="reason" name="reason" required>
        </div>
        <div class="field">
          <label for="diagnosis">Diagnosis</label>
          <input type="text" id="diagnosis" name="diagnosis">
        </div>
        <div class="field">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes"></textarea>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" type="submit">Save consultation</button>
          <a class="btn btn-ghost" href="patient_record.html">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <footer>
    <div class="shell">HealthByte — static preview, no backend connected</div>
  </footer>

</body>
</html>
